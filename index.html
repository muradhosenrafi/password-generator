<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="inputbox">
            <input type="text" class="passbox" id="passbox" readonly aria-label="Generated password" placeholder="Your password will appear here">
            <button type="button" class="copybtn" id="copybtn" disabled>Copy</button>
        </div>
        <input type="range" min="1" max="30" value="8" id="inputslider">
        <div class="row">
            <p>Password Length</p>
            <span id="slidevalue">8</span>
        </div>

        <div class="row">
            <label for="lowercase" class="lowercase">Include Lowercase Letter (a-z)</label>
            <input type="checkbox" name="lowercase" id="lowercase" checked>
        </div>
        <div class="row">
            <label for="upercase" class="lowercase">Include Uppercase Letter (A-Z)</label>
            <input type="checkbox" name="upercase" id="upercase" checked>
        </div>
        <div class="row">
            <label for="number" class="lowercase">Include Number (0-9)</label>
            <input type="checkbox" name="number" id="number" checked>
        </div>
        <div class="row">
            <label for="symbols" class="lowercase">Include Symbols (@-*)</label>
            <input type="checkbox" name="symbols" id="symbols" checked>
        </div>
        <button type="button" class="getbtn">Generate Password</button>
        <p class="copy-status" id="copystatus" role="status" aria-live="polite"></p>
    </div>

    <script src="./script.js"></script>
</body>
</html>
